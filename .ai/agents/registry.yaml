agents:
  - id: "architect"
    role: "System Architect"
    prompt: ".ai/prompts/system/agent.architect.system.md"
    responsibilities:
      - "Проєктує структуру репозиторію та протоколи"
      - "Веде .ai/docs/01-architecture.md та .ai/docs/03-handoff-protocol.md"
      - "Створює ADR у .ai/memory/decisions/"
    delegates_to:
      - "worker"
      - "researcher"
    escalates_to: []

  - id: "orchestrator"
    role: "Orchestrator"
    prompt: ".ai/prompts/system/agent.orchestrator.system.md"
    responsibilities:
      - "Координує роботу агентів"
      - "Підтримує .ai/memory/state/project-state.yaml"
      - "Забезпечує створення Handoff Package після кожної сесії"
    delegates_to:
      - "worker"
      - "researcher"
      - "reviewer"
    escalates_to:
      - "architect"

  - id: "worker"
    role: "Worker"
    prompt: ".ai/prompts/system/agent.worker.system.md"
    responsibilities:
      - "Виконує конкретні задачі з work_items"
      - "Продукує артефакти (файли)"
    delegates_to: []
    escalates_to:
      - "orchestrator"

  - id: "reviewer"
    role: "Reviewer"
    prompt: ".ai/prompts/system/agent.reviewer.system.md"
    responsibilities:
      - "Перевіряє артефакти за .ai/docs/04-quality-gates.md"
      - "Виносить вердикт approved / rejected"
    delegates_to: []
    escalates_to:
      - "orchestrator"
      - "architect"

  - id: "researcher"
    role: "Researcher"
    prompt: ".ai/prompts/system/agent.researcher.system.md"
    responsibilities:
      - "Досліджує теми та збирає інформацію"
      - "Зберігає знахідки у .ai/memory/knowledge/"
    delegates_to: []
    escalates_to:
      - "orchestrator"
