name: Lint Markdown and YAML

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: markdownlint "**/*.md" --ignore node_modules

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yml .

  session-structure:
    name: Session Structure Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check session folder structure
        shell: bash
        run: |
          EXIT_CODE=0
          SESSIONS_DIR=".ai/logs/sessions"

          if [ ! -d "$SESSIONS_DIR" ]; then
            echo "INFO: $SESSIONS_DIR does not exist, skipping check."
            exit 0
          fi

          for session_dir in "$SESSIONS_DIR"/*/; do
            [ -d "$session_dir" ] || continue
            session_name=$(basename "$session_dir")

            if [ ! -f "$session_dir/snapshot.yaml" ]; then
              echo "ERROR: $session_dir is missing snapshot.yaml"
              EXIT_CODE=1
            fi

            if [ ! -f "$session_dir/handoff.md" ]; then
              echo "ERROR: $session_dir is missing handoff.md"
              EXIT_CODE=1
            fi
          done

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "OK: All session folders have snapshot.yaml and handoff.md"
          fi
          exit "$EXIT_CODE"

  project-state-check:
    name: Project State Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate project-state.yaml required fields
        shell: bash
        run: |
          STATE_FILE=".ai/memory/state/project-state.yaml"
          EXIT_CODE=0

          if [ ! -f "$STATE_FILE" ]; then
            echo "ERROR: $STATE_FILE not found"
            exit 1
          fi

          for field in "version" "date" "work_items"; do
            if ! grep -q "^${field}:" "$STATE_FILE"; then
              echo "ERROR: $STATE_FILE is missing required field: $field"
              EXIT_CODE=1
            fi
          done

          if ! grep -q "phase:" "$STATE_FILE"; then
            echo "ERROR: $STATE_FILE is missing required field: state.phase"
            EXIT_CODE=1
          fi

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "OK: $STATE_FILE has all required fields"
          fi
          exit "$EXIT_CODE"
